# WTmag writes this template to ~/.config/wtmag/config.toml on first run if the file does not exist.
# You can also copy it there yourself and edit it ahead of time.

# Default agent selection.
[agents.default]
# WTmag uses this agent when `--agent` is omitted.
# Use one of the built-in agent names below, or whatever comes after `agents.` in a custom agent definition.
name = "pi"

# Built-in agent definitions.
# Edit these if you want the built-in names to launch differently on your machine.
[agents.pi]
command = "pi"
prompt_flag = ""

[agents.opencode]
command = "opencode"
prompt_flag = "--prompt"

[agents.claude]
command = "claude"
prompt_flag = ""

[agents.codex]
command = "codex"
prompt_flag = ""

# Custom agent examples.
# Each [agents.<name>] block defines one agent.
# The <name> is what you pass to `--agent`, and what you can use in [agents.default].name.
# `prompt_flag` is optional. If you omit it, WTmag passes the prompt positionally.

# [agents.aider]
# command = "aider"
# prompt_flag = "--message"

# [agents.custom-agent-with-args]
# command = "my-agent"
# args = ["run", "--profile", "coding"]
